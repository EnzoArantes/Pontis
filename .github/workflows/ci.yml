# CI: the clean-room rebuild, on every push, on Linux.
#
# This is deliberately the same sequence a stranger follows from the README --
# empty Postgres, migrations 001..NNN in filename order, both seeds, full test
# suite. The database-backed constraint tests (tests/test_db_constraints.py)
# run for real here against the service container; they skip only where no
# database exists.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pontis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: pontis

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Applied TWICE, then once more after seeding: the chain must CONVERGE,
      # not merely apply. A destructive step that only bites on re-application
      # (001's old DROP TYPE CASCADE amputated a v008 column on the second
      # container boot -- see HARDENING.md) is exactly what a single pass
      # cannot see.
      - name: Apply migrations in order, twice
        run: |
          for round in 1 2; do
            echo "=== chain round $round"
            for f in schema/*.sql; do
              echo "== $f"
              psql -v ON_ERROR_STOP=1 -q -f "$f"
            done
          done

      - name: Seed reference data and schools
        run: |
          python ingest/seed_reference.py
          python ingest/seed_phase1.py

      - name: Re-apply the chain over seeded data
        run: |
          for f in schema/*.sql; do
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Validate the batch pipeline (no CSV in CI -- unit layer only)
        run: python -m pytest tests/test_pipeline.py -q

      - name: Run the full test suite
        run: python -m pytest -q
